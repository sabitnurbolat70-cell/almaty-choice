<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алматы таңдауы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Артқы жарқыраған неон дақтары -->
  <div class="orb orb-purple"></div>
  <div class="orb orb-blue"></div>
  <div class="orb orb-cyan"></div>

  <!-- Сұрақ карточкасы -->
  <main class="card" id="quiz">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <p class="counter" id="counter"></p>
    <h1 id="question"></h1>
    <div class="options" id="options"></div>
    <textarea id="custom" class="custom" rows="3"
      placeholder="Өз ойыңызды жазыңыз..." hidden></textarea>
    <div class="actions">
      <button class="btn ghost" id="back">← Артқа</button>
      <button class="btn primary" id="next" disabled>Келесі →</button>
    </div>
  </main>

  <!-- Қорытынды экраны -->
  <main class="card" id="result" hidden>
    <h1>Рахмет! 🎉</h1>
    <p class="counter">Сіздің таңдауыңыз:</p>
    <div id="summary"></div>
    <div class="actions">
      <button class="btn ghost" id="restart">Қайта бастау</button>
      <button class="btn primary" id="download">JSON жүктеу</button>
    </div>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
